name: my_diary
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.0
  http: ^1.2.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  shared_preferences: ^2.3.2
  auto_size_text: ^3.0.0
  image_picker: ^0.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#000000"
  image: assets/splash_icon.png

  android_12:
    color: "#000000"
    image: assets/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/login_icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/login_icon.jpg

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
